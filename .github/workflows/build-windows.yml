name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
        shell: powershell

      - name: Install NSIS via Chocolatey
        run: choco install nsis -y --no-progress
        shell: powershell

      - name: Download NSSM from GitHub mirror
        run: |
          New-Item -ItemType Directory -Force -Path windows/build/nssm | Out-Null
          # Use a reliable GitHub-hosted nssm binary
          $urls = @(
            "https://github.com/NSSM-Service/nssm/releases/download/2.24/nssm-win64.exe",
            "https://raw.githubusercontent.com/bmrf/standalone_scripts/master/nssm.exe"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile "windows/build/nssm/nssm.exe" -TimeoutSec 30 -ErrorAction Stop
              $size = (Get-Item "windows/build/nssm/nssm.exe").Length
              if ($size -gt 100000) {
                Write-Host "Downloaded nssm from $url ($size bytes)"
                $downloaded = $true
                break
              }
            } catch { Write-Host "Failed: $url" }
          }
          if (-not $downloaded) {
            # Last resort: extract from choco cache if nssm was previously installed
            $cached = Get-ChildItem "C:\ProgramData\chocolatey" -Recurse -Filter "nssm.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -gt 100000 } | Select-Object -First 1
            if ($cached) {
              Copy-Item $cached.FullName "windows/build/nssm/nssm.exe"
              Write-Host "Used cached nssm: $($cached.FullName)"
            } else {
              throw "Could not obtain nssm.exe from any source"
            }
          }
        shell: powershell

      - name: Bundle Node.js runtime
        run: |
          $nodeExe = Get-Command node | Select-Object -ExpandProperty Source
          $nodeDir = Split-Path $nodeExe
          New-Item -ItemType Directory -Force -Path windows/build/node | Out-Null
          Copy-Item "$nodeDir\node.exe" windows/build/node/
          if (Test-Path "$nodeDir\node_modules") {
            Copy-Item -Recurse "$nodeDir\node_modules" windows/build/node/node_modules -ErrorAction SilentlyContinue
          }
          Copy-Item "$nodeDir\npm.cmd" windows/build/node/npm.cmd -ErrorAction SilentlyContinue
          Copy-Item "$nodeDir\npx.cmd" windows/build/node/npx.cmd -ErrorAction SilentlyContinue
        shell: powershell

      - name: Stage app for installer (with node_modules)
        run: |
          # node_modules are already installed by npm ci above
          # Verify better-sqlite3 native binary exists for win32
          $bsq3 = Get-ChildItem "node_modules\better-sqlite3\prebuilds" -Recurse -Filter "*.node" -ErrorAction SilentlyContinue
          Write-Host "better-sqlite3 prebuilds: $($bsq3.Count) files"
          $bsq3 | ForEach-Object { Write-Host "  $($_.FullName)" }
        shell: powershell

      - name: Update version in installer
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $paddedVersion = "$version.0"
          $content = Get-Content windows/installer.nsi -Raw
          $content = $content -replace 'VIProductVersion "[^"]*"', "VIProductVersion `"$paddedVersion`""
          $content = $content -replace '"DisplayVersion" "[^"]*"', "`"DisplayVersion`" `"$version`""
          $content = $content -replace '"FileVersion" "[^"]*"', "`"FileVersion`" `"$version`""
          Set-Content windows/installer.nsi $content
        shell: powershell

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" windows/installer.nsi
        shell: powershell

      - name: Get version
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Delete existing release/tag if present
        continue-on-error: true
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" `
            -Headers @{ Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept="application/vnd.github+json" } `
            -ErrorAction SilentlyContinue
          if ($resp.id) {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($resp.id)" `
              -Method Delete `
              -Headers @{ Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept="application/vnd.github+json" }
            Write-Host "Deleted release $($resp.id)"
          }
          git tag -d $tag 2>$null
          git push origin :refs/tags/$tag 2>$null
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Cardoso v${{ steps.version.outputs.version }}"
          files: CardosoSetup.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
