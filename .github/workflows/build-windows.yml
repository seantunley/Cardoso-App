name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022  # pinned - windows-latest transitioning to 2025, breaks native module ABI
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (native binaries compiled for win32/x64/node22)
        run: npm ci
        shell: powershell

      - name: Guard pdfjs-dist version (load-bearing pin)
        # 4.10+ switched to ImageBitmap-based rendering which node-canvas
        # doesn't accept. The pin in package.json is load-bearing — until
        # the planned PDF-engine migration lands, this CI check fails the
        # build if anything (including npm update) ever bumps it.
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).dependencies.'pdfjs-dist'
          if ($version -ne '4.8.69') {
            Write-Error "pdfjs-dist must be pinned to exactly 4.8.69 (got: $version). See src/services/ocrWorker.js for why. Migration plan: docs/plans/pdf-engine-migration.md"
            exit 1
          }
          Write-Host "pdfjs-dist pin verified: $version"
        shell: powershell

      - name: Lint
        run: npm run lint
        shell: powershell

      - name: Build frontend
        run: npm run build
        shell: powershell

      - name: Stage app files for installer
        run: |
          New-Item -ItemType Directory -Force -Path windows/build/app | Out-Null
          # Copy app files
          Copy-Item server.js windows/build/app/
          Copy-Item package.json windows/build/app/
          Copy-Item package-lock.json windows/build/app/
          Copy-Item -Recurse dist windows/build/app/dist
          Copy-Item -Recurse src windows/build/app/src
          Copy-Item -Recurse scripts windows/build/app/scripts
          # Copy node_modules WITH pre-compiled native binaries (built on this windows runner)
          Copy-Item -Recurse node_modules windows/build/app/node_modules
          Write-Host "Staged app. node_modules size: $((Get-ChildItem windows/build/app/node_modules -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB) MB"
          # Confirm the better-sqlite3 native binary is present - fail build
          # if missing. As of v2026.4.18 better-sqlite3 backs both the app DB
          # AND the session store (via better-sqlite3-session-store), so the
          # old separate `sqlite3` package check has been removed.
          $bsq3 = Get-ChildItem windows/build/app/node_modules/better-sqlite3 -Recurse -Filter "*.node" -ErrorAction SilentlyContinue
          $bsq3 | ForEach-Object { Write-Host "BSQ3: $($_.FullName)" }
          if (-not $bsq3) { throw "better-sqlite3 native binary missing - build will not work" }
        shell: powershell

      - name: Install NSIS
        run: |
          $nsisInstaller = "$env:TEMP\nsis-setup.exe"
          $urls = @(
            "https://github.com/nicehash/NiceHashQuickMiner/releases/download/v0.0.0/nsis-3.10-setup.exe",
            "https://prdownloads.sourceforge.net/nsis/nsis-3.10-setup.exe?download",
            "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10-setup.exe/download"
          )
          $installed = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Trying $url"
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              Invoke-WebRequest -Uri $url -OutFile $nsisInstaller -UseBasicParsing -TimeoutSec 60 -ErrorAction Stop
              $size = (Get-Item $nsisInstaller).Length
              Write-Host "Downloaded $size bytes"
              if ($size -gt 1MB) {
                Start-Process -FilePath $nsisInstaller -ArgumentList "/S" -Wait
                $installed = $true
                break
              }
            } catch { Write-Host "Failed: $_" }
          }
          if (-not $installed) {
            Write-Host "Direct download failed, trying Chocolatey..."
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { throw "NSIS install failed" }
          Write-Host "NSIS ready"
        shell: powershell

      - name: Download NSSM
        run: |
          New-Item -ItemType Directory -Force -Path windows/build/nssm | Out-Null
          $urls = @(
            "https://github.com/NSSM-Service/nssm/releases/download/2.24/nssm-win64.exe",
            "https://raw.githubusercontent.com/bmrf/standalone_scripts/master/nssm.exe"
          )
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile "windows/build/nssm/nssm.exe" -TimeoutSec 30 -ErrorAction Stop
              $size = (Get-Item "windows/build/nssm/nssm.exe").Length
              if ($size -gt 100000) { Write-Host "Got nssm ($size bytes) from $url"; break }
            } catch { Write-Host "Failed: $url" }
          }
          if (-not (Test-Path "windows/build/nssm/nssm.exe") -or (Get-Item "windows/build/nssm/nssm.exe").Length -lt 100000) {
            $cached = Get-ChildItem "C:\ProgramData\chocolatey" -Recurse -Filter "nssm.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -gt 100000 } | Select-Object -First 1
            if ($cached) { Copy-Item $cached.FullName "windows/build/nssm/nssm.exe"; Write-Host "Used choco cache" }
            else { throw "Cannot obtain nssm.exe" }
          }
        shell: powershell

      - name: Bundle Node.js runtime
        run: |
          $nodeExe = (Get-Command node).Source
          $nodeDir = Split-Path $nodeExe
          New-Item -ItemType Directory -Force -Path windows/build/node | Out-Null
          Copy-Item "$nodeDir\node.exe" windows/build/node/
          if (Test-Path "$nodeDir\node_modules") {
            Copy-Item -Recurse "$nodeDir\node_modules" windows/build/node/node_modules -ErrorAction SilentlyContinue
          }
        shell: powershell

      - name: Compute lock hash
        id: lockhash
        run: |
          $hash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash.ToLower()
          echo "lock_hash=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "lock_hash=$hash"
        shell: powershell

      - name: Build delta app zip
        # Tiny artifact (~5MB) containing everything that changes most releases:
        # server.js, src/, dist/, scripts/, package.json. Excludes node_modules,
        # node, nssm — those are heavy and rarely change. The in-app updater
        # downloads this instead of the full EXE when the installed
        # package-lock.json hash matches the new release's lock_hash.
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path windows/build/delta | Out-Null
          Copy-Item server.js windows/build/delta/
          Copy-Item package.json windows/build/delta/
          Copy-Item package-lock.json windows/build/delta/
          Copy-Item -Recurse dist windows/build/delta/dist
          Copy-Item -Recurse src windows/build/delta/src
          Copy-Item -Recurse scripts windows/build/delta/scripts
          Compress-Archive -Path windows/build/delta/* -DestinationPath "app-v$version.zip" -Force
          $zipBytes = (Get-Item "app-v$version.zip").Length
          $appHash  = (Get-FileHash "app-v$version.zip" -Algorithm SHA256).Hash.ToLower()
          "$appHash *app-v$version.zip" | Set-Content "app-v$version.zip.sha256" -NoNewline
          Write-Host "app-v$version.zip = $($zipBytes / 1MB) MB · sha256=$appHash"
        shell: powershell

      - name: Update version in installer
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $lockHash = "${{ steps.lockhash.outputs.lock_hash }}"
          $content = Get-Content windows/installer.nsi -Raw
          $content = $content -replace 'VIProductVersion "[^"]*"', "VIProductVersion `"$version.0`""
          $content = $content -replace '"DisplayVersion" "[^"]*"', "`"DisplayVersion`" `"$version`""
          $content = $content -replace '"FileVersion" "[^"]*"', "`"FileVersion`" `"$version`""
          # New defines so the install section can write .lock-hash and
          # .installed-version markers to disk for the in-app delta updater.
          $content = $content -replace '!define LOCK_HASH "[^"]*"',         "!define LOCK_HASH `"$lockHash`""
          $content = $content -replace '!define INSTALLED_VERSION "[^"]*"', "!define INSTALLED_VERSION `"$version`""
          Set-Content windows/installer.nsi $content
        shell: powershell

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" windows/installer.nsi
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Rename-Item CardosoSetup.exe "CardosoSetup-v$v.exe"
          $hash = (Get-FileHash "CardosoSetup-v$v.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash *CardosoSetup-v$v.exe" | Set-Content "CardosoSetup-v$v.exe.sha256" -NoNewline
        shell: powershell

      - name: Build manifest.json
        # Manifest tells the in-app updater whether a delta update is possible
        # for this release. If the installed lock_hash matches manifest.lock_hash,
        # the updater downloads app_zip (~5MB) instead of the full installer.
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $appHash  = (Get-FileHash "app-v$v.zip" -Algorithm SHA256).Hash.ToLower()
          $exeHash  = (Get-FileHash "CardosoSetup-v$v.exe" -Algorithm SHA256).Hash.ToLower()
          $lockHash = "${{ steps.lockhash.outputs.lock_hash }}"
          $manifest = [ordered]@{
            version          = $v
            lock_hash        = $lockHash
            app_zip          = "app-v$v.zip"
            app_zip_sha256   = $appHash
            installer        = "CardosoSetup-v$v.exe"
            installer_sha256 = $exeHash
          } | ConvertTo-Json -Depth 5
          $manifest | Set-Content -Path "manifest-v$v.json" -NoNewline
          Write-Host $manifest
        shell: powershell

      - name: Get version
        id: version
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Delete existing release/tag if present
        continue-on-error: true
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" `
            -Headers @{ Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept="application/vnd.github+json" } `
            -ErrorAction SilentlyContinue
          if ($resp.id) {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($resp.id)" `
              -Method Delete -Headers @{ Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept="application/vnd.github+json" }
          }
          git tag -d $tag 2>$null; git push origin ":refs/tags/$tag" 2>$null
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            CardosoSetup-v${{ steps.version.outputs.version }}.exe
            CardosoSetup-v${{ steps.version.outputs.version }}.exe.sha256
            app-v${{ steps.version.outputs.version }}.zip
            app-v${{ steps.version.outputs.version }}.zip.sha256
            manifest-v${{ steps.version.outputs.version }}.json
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
