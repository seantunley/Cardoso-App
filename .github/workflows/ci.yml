name: CI

# Minimum-viable PR gate. Anything beyond lint + build + audit-critical +
# secret-scan gets added separately as the baseline reaches green:
# - typecheck is scoped via tsconfig.typecheck.json; the broad legacy
#   baseline is still measured with npm run typecheck:legacy.
# - npm audit is set to --audit-level=critical, not high, because xlsx
#   has known unfixed high-severity CVEs that are mitigated by trust
#   boundary; flagged in tech-debt.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    # Pinned to windows-2022 to match the deployment runtime AND the
    # build-windows.yml release workflow. Native module ABI on
    # windows-latest is in transition to windows-2025; using a Linux
    # runner here would mean canvas / better-sqlite3 / sharp compile
    # for a different OS than ships, which defeats the point of the gate.
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        shell: powershell

      # The PDF-engine migration is fully landed: Phase 2 moved the
      # renderer to PDFium (@hyzyla/pdfium) and removed node-canvas;
      # Phase 3 moved the text-layer fast-path to PDFium too and
      # removed pdfjs-dist. The 4.8.69 CI guard that used to live
      # here has been deleted as obsolete.

      - name: Lint
        run: npm run lint
        shell: powershell

      - name: Check migration version contiguity
        # Asserts every migration in src/db/migrations.js has a unique,
        # contiguous version (no gaps from 1..N). Catches the "two PRs
        # each added migration N, conflict resolution dropped one"
        # class of bug — see scripts/check-migration-versions.mjs for
        # the 2026-05-11 missing-v62 incident this guards against.
        run: npm run check:migrations
        shell: powershell

      - name: Typecheck
        run: npm run typecheck
        shell: powershell

      - name: Build frontend
        run: npm run build
        shell: powershell

      - name: Tests
        # vitest covering parseSupplierSpreadsheet (PR #171). First module
        # under test coverage; expands as more modules join. Tests must
        # pass for the PR to merge.
        run: npm test
        shell: powershell

      - name: Audit (critical only)
        # --audit-level=critical not high. xlsx has unfixed high CVEs
        # we accept by trust-boundary (see tech-debt.md). Critical-only
        # ensures this gate fails on actual emergencies, not on the
        # known accepted-risk items.
        run: npm audit --audit-level=critical
        shell: powershell

  secret-scan:
    # Runs the gitleaks CLI directly (pinned) instead of gitleaks-action@v3.
    # The action now enforces a paid GITLEAKS_LICENSE, and whenever its
    # GitHub-API user lookup flakes (returns malformed JSON) it falls back to
    # *requiring* that license and fails the job — intermittently red on every
    # PR even though the CLI binary is free and open-source. Linux runner: a
    # pure git-history scan with no native deps.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks scans full history

      - name: Secret scan (gitleaks CLI)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          # Scan git history; exit 1 (fail the job) on any finding. No repo
          # .gitleaks.toml present, so this uses gitleaks' default ruleset —
          # the same rules the action ran.
          ./gitleaks git --redact --no-banner --exit-code 1 .
